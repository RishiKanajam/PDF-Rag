name: tests

# Unit tests only. The paid LLM evaluation (eval/run_eval.py --all) never runs
# in CI, and no API keys are configured here.

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first, so the lock file doesn't pull CUDA wheels.
          pip install "torch==$(grep -i '^torch==' requirements-lock.txt | cut -d= -f3)" \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lock.txt

      - name: Download NLTK sentence tokenizer
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Run unit tests
        run: python -m pytest -q
